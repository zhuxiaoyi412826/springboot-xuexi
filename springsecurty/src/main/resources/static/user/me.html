<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人中心 - 视频小站</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="container">
    <h1>个人中心</h1>
    <div id="msg"></div>

    <div class="panel">
        <h2>资料</h2>
        <div class="row">
            <label>昵称</label><input id="nickname" type="text">
            <label>邮箱</label><input id="email" type="text">
        </div>
        <div class="row">
            <label>手机</label><input id="phone" type="text">
            <label>头像URL</label><input id="avatar" type="text">
        </div>
        <div class="row">
            <label></label>
            <button id="btnSave">保存资料</button>
        </div>
    </div>

    <div class="panel">
        <h2>修改密码</h2>
        <div class="row">
            <label>旧密码</label><input id="oldPassword" type="password">
            <label>新密码</label><input id="newPassword" type="password">
            <button class="orange" id="btnPwd">修改</button>
        </div>
        <div class="muted">修改后会同步更新 BCrypt 密文与 Digest 摘要。</div>
    </div>

    <div class="panel">
        <h2>我的收藏 / 评论 / 上传</h2>
        <div class="tabs">
            <button id="tabFav" class="active">收藏</button>
            <button id="tabComment">评论</button>
            <button id="tabVideo">我上传的</button>
            <button id="tabSession">我的会话</button>
            <button id="tabLog">登录日志</button>
        </div>
        <div id="boxFav"></div>
        <div id="boxComment" class="hidden"></div>
        <div id="boxVideo" class="hidden"></div>
        <div id="boxSession" class="hidden"></div>
        <div id="boxLog" class="hidden"></div>
    </div>

    <pre class="log" id="log"></pre>
</div>
<script src="../js/common.js"></script>
<script src="../js/me.js"></script>
</body>
</html>
