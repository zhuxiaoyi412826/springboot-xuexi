server:
  port: 8084
  servlet:
    session:
      timeout: 30m          # 会话超时（知识点：会话管理）
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: video-site

  # ---------------- 数据源 ----------------
  datasource:
    # createDatabaseIfNotExist=true：首次启动自动建库，之后由 db/schema.sql 建表
    url: jdbc:mysql://127.0.0.1:3306/video_site?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: "412826"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: none        # 表结构由 db/schema.sql 维护
    open-in-view: false
    show-sql: false

  # 启动时执行建表/初始化数据脚本（幂等：IF NOT EXISTS / INSERT IGNORE）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true
      separator: ";"

  # ---------------- Redis ----------------
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 实测本机 Redis 未设置 requirepass，所以这里留空；
      # 若你执行了 CONFIG SET requirepass knfiej，就把下一行改成 knfiej
      password:
      timeout: 3s

  # ---------------- 会话：Spring Session + Redis（会话共享） ----------------
  # 改成 none 则退回 Servlet 容器内存会话（单机模式）
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: videosite:session

  # ---------------- OAuth2 / OIDC 第三方登录 ----------------
  # 说明：这里刻意不写 spring.security.oauth2.client.registration.*，
  # 因为客户端 id/secret 为空会导致启动失败。
  # 请改用环境变量：GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET
  #（或直接在下面 app.oauth2.github 里写死），填了才会启用 GitHub 登录。
  security:
    oauth2:
      client:
        registration: {}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

logging:
  level:
    org.springframework.security: INFO
    org.example.security: DEBUG

# ---------------- 自定义配置 ----------------
app:
  # HTTP Digest 认证的 realm（必须与 DigestSecurityConfig 一致）
  digest:
    realm: VideoSite
  # GitHub OAuth2 登录（留空则不启用，登录页会自动隐藏该按钮）
  oauth2:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  # JWT 资源服务器演示：本地自签发的 JWT
  jwt:
    issuer: video-site
    ttl-minutes: 120
  # API Key 演示（自定义认证过滤器）
  api-key: video-site-api-key-8888
  # 登录失败锁定策略
  login:
    max-attempts: 5
    lock-minutes: 10
  # 响应式（WebFlux）Security 示例开关：默认关闭
  webflux:
    enabled: false
  # 会话存储：memory（默认） | redis（需 Redis 可用）
  session-store: memory
