spring:
  application:
    name: novel-reader

  # ============ 数据源（MySQL） ============
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：不要写 characterEncoding=utf8mb4，Java 侧不认识这个编码名；Connector/J 8+ 默认即 utf8mb4
    url: jdbc:mysql://127.0.0.1:3306/novel_reader?createDatabaseIfNotExist=true&useUnicode=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: '412826'

  # ============ 启动自动执行 SQL 脚本（建库建表 + 演示数据） ============
  # 库不存在时会被上面的 createDatabaseIfNotExist=true 自动创建
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false

  # ============ 文件上传 ============
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8082

# ============ MyBatis 核心配置 ============
mybatis:
  # XML 映射文件位置（复杂 SQL 写在这里）
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体别名包，XML 里可以直接写类名，不用写全限定名
  type-aliases-package: org.example.mybatis.entity
  configuration:
    # 下划线 -> 驼峰自动映射：create_time => createTime
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，方便学习观察（生产建议换成 Slf4jImpl）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 二级缓存总开关（各 Mapper 命名空间需自行 <cache> 开启）
    cache-enabled: true
    # 允许 jdbcType 为 null 时的默认值处理
    jdbc-type-for-null: 'null'
    default-fetch-size: 100

# ============ 自定义配置 ============
novel:
  # 上传的 TXT 原文件存放目录
  upload-dir: ./upload/novels/
  # 慢 SQL 阈值（毫秒），自定义 MyBatis 插件使用，超过会 WARN 告警
  slow-sql-threshold-ms: 100
